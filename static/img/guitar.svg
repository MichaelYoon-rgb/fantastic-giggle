<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 320" fill="none">
  <!-- Acoustic guitar - grainy pastel style -->
  <!-- Headstock -->
  <rect x="48" y="0" width="24" height="50" rx="5" fill="currentColor" opacity="0.7"/>
  <circle cx="54" cy="12" r="4" fill="currentColor" opacity="0.5"/>
  <circle cx="66" cy="12" r="4" fill="currentColor" opacity="0.5"/>
  <circle cx="54" cy="26" r="4" fill="currentColor" opacity="0.5"/>
  <circle cx="66" cy="26" r="4" fill="currentColor" opacity="0.5"/>
  <circle cx="54" cy="40" r="4" fill="currentColor" opacity="0.5"/>
  <circle cx="66" cy="40" r="4" fill="currentColor" opacity="0.5"/>
  
  <!-- Nut -->
  <rect x="46" y="48" width="28" height="5" rx="2" fill="currentColor" opacity="0.9"/>
  
  <!-- Neck -->
  <rect x="50" y="53" width="20" height="120" rx="3" fill="currentColor" opacity="0.6"/>
  
  <!-- Fret markers -->
  <circle cx="60" cy="78" r="2.5" fill="currentColor" opacity="0.3"/>
  <circle cx="60" cy="98" r="2.5" fill="currentColor" opacity="0.3"/>
  <circle cx="60" cy="118" r="2.5" fill="currentColor" opacity="0.3"/>
  <circle cx="60" cy="138" r="2.5" fill="currentColor" opacity="0.3"/>
  <circle cx="55" cy="158" r="2.5" fill="currentColor" opacity="0.3"/>
  <circle cx="65" cy="158" r="2.5" fill="currentColor" opacity="0.3"/>
  
  <!-- Fret lines -->
  <line x1="50" y1="68" x2="70" y2="68" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="88" x2="70" y2="88" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="108" x2="70" y2="108" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="128" x2="70" y2="128" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="148" x2="70" y2="148" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="168" x2="70" y2="168" stroke="currentColor" stroke-width="1" opacity="0.4"/>
  
  <!-- Strings on neck -->
  <line x1="54" y1="53" x2="54" y2="173" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="57" y1="53" x2="57" y2="173" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="53" x2="60" y2="173" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
  <line x1="63" y1="53" x2="63" y2="173" stroke="currentColor" stroke-width="0.6" opacity="0.3"/>
  <line x1="66" y1="53" x2="66" y2="173" stroke="currentColor" stroke-width="0.7" opacity="0.3"/>
  
  <!-- Body - upper bout -->
  <ellipse cx="60" cy="200" rx="42" ry="30" fill="currentColor" opacity="0.5"/>
  
  <!-- Body - lower bout (bigger) -->
  <ellipse cx="60" cy="260" rx="55" ry="45" fill="currentColor" opacity="0.5"/>
  
  <!-- Body connector (waist) -->
  <ellipse cx="60" cy="230" rx="32" ry="20" fill="currentColor" opacity="0.5"/>
  
  <!-- Sound hole -->
  <circle cx="60" cy="230" r="18" fill="currentColor" opacity="0.2"/>
  <circle cx="60" cy="230" r="15" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
  
  <!-- Rosette decoration -->
  <circle cx="60" cy="230" r="20" fill="none" stroke="currentColor" stroke-width="1" opacity="0.15"/>
  
  <!-- Bridge -->
  <rect x="45" y="268" width="30" height="6" rx="3" fill="currentColor" opacity="0.7"/>
  
  <!-- Bridge pins -->
  <circle cx="49" cy="271" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="54" cy="271" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="59" cy="271" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="64" cy="271" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="69" cy="271" r="1.5" fill="currentColor" opacity="0.4"/>
  <circle cx="71" cy="271" r="1.5" fill="currentColor" opacity="0.4"/>
  
  <!-- Strings on body -->
  <line x1="54" y1="173" x2="49" y2="268" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="57" y1="173" x2="54" y2="268" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
  <line x1="60" y1="173" x2="59" y2="268" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <line x1="63" y1="173" x2="64" y2="268" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <line x1="66" y1="173" x2="69" y2="268" stroke="currentColor" stroke-width="0.7" opacity="0.2"/>
</svg>
