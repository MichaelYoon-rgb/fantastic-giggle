<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Headphones - grainy pastel style -->
  
  <!-- Headband arc -->
  <path d="M15 55 C15 25 30 8 50 8 C70 8 85 25 85 55" 
        stroke="currentColor" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Headband padding -->
  <path d="M35 12 C38 8 45 5 50 5 C55 5 62 8 65 12" 
        stroke="currentColor" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>
  
  <!-- Left ear cup - outer -->
  <rect x="5" y="48" width="24" height="35" rx="10" fill="currentColor" opacity="0.5"/>
  
  <!-- Left ear cup - inner cushion -->
  <rect x="8" y="51" width="18" height="29" rx="8" fill="currentColor" opacity="0.3"/>
  
  <!-- Left ear cup - speaker -->
  <circle cx="17" cy="65" r="6" fill="currentColor" opacity="0.2"/>
  
  <!-- Right ear cup - outer -->
  <rect x="71" y="48" width="24" height="35" rx="10" fill="currentColor" opacity="0.5"/>
  
  <!-- Right ear cup - inner cushion -->
  <rect x="74" y="51" width="18" height="29" rx="8" fill="currentColor" opacity="0.3"/>
  
  <!-- Right ear cup - speaker -->
  <circle cx="83" cy="65" r="6" fill="currentColor" opacity="0.2"/>
  
  <!-- Left connector -->
  <rect x="13" y="43" width="8" height="8" rx="2" fill="currentColor" opacity="0.4"/>
  
  <!-- Right connector -->
  <rect x="79" y="43" width="8" height="8" rx="2" fill="currentColor" opacity="0.4"/>
  
  <!-- Cable from left ear -->
  <path d="M17 83 C17 90 20 95 25 95" stroke="currentColor" stroke-width="2" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>
