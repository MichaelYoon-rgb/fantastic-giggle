<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" fill="none">
  <!-- Music Note (Eighth Note) - grainy pastel style -->
  
  <!-- Note head -->
  <ellipse cx="25" cy="100" rx="18" ry="13" transform="rotate(-20 25 100)" fill="currentColor" opacity="0.5"/>
  
  <!-- Stem -->
  <line x1="40" y1="92" x2="40" y2="15" stroke="currentColor" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Flag -->
  <path d="M40 15 C55 20 65 35 55 50 C52 42 45 36 40 33" fill="currentColor" opacity="0.4"/>
  
  <!-- Decorative swirl -->
  <path d="M55 50 C58 55 56 62 50 60" stroke="currentColor" stroke-width="2" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>
